<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#172A46"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Laptop Display -->
  <g filter="url(#shadow)">
    <!-- Screen Outer -->
    <rect x="50" y="40" width="500" height="320" rx="16" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <!-- Screen Inner -->
    <rect x="65" y="55" width="470" height="280" rx="8" fill="url(#hGrad)"/>
    
    <!-- Top bar inside laptop -->
    <rect x="65" y="55" width="470" height="30" fill="#1E293B"/>
    <circle cx="85" cy="70" r="5" fill="#EF4444"/>
    <circle cx="100" cy="70" r="5" fill="#F59E0B"/>
    <circle cx="115" cy="70" r="5" fill="#10B981"/>
    
    <!-- Hero Mock Inside -->
    <text x="95" y="125" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Tu Negocio Abierto al Mundo 24/7</text>
    <text x="95" y="150" font-family="sans-serif" font-size="12" fill="#94A3B8">Páginas web profesionales listas en 24 Horas</text>
    
    <!-- Button Inside -->
    <rect x="95" y="170" width="140" height="32" rx="6" fill="#FF7A00"/>
    <text x="115" y="191" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Pedir por WhatsApp</text>
    
    <!-- Mock mini cards inside laptop -->
    <rect x="95" y="220" width="130" height="90" rx="6" fill="#1e293b"/>
    <rect x="245" y="220" width="130" height="90" rx="6" fill="#1e293b"/>
    <rect x="395" y="220" width="120" height="90" rx="6" fill="#1e293b"/>
    
    <!-- Laptop Base -->
    <path d="M 10 360 L 590 360 L 550 380 L 50 380 Z" fill="#334155"/>
    <rect x="250" y="360" width="100" height="6" rx="3" fill="#64748B"/>
  </g>

  <!-- NFC Card Floating Badge -->
  <g transform="translate(380, 260)" filter="url(#shadow)">
    <rect width="190" height="120" rx="12" fill="url(#cardGrad)"/>
    <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">TARJETA NFC ⚡</text>
    <text x="20" y="60" font-family="sans-serif" font-size="10" fill="#ffedd5">Acerca tu móvil para ver el Menú o calificar en Google</text>
    <circle cx="150" cy="90" r="16" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M 142 85 A 10 10 0 0 1 158 85 M 138 92 A 16 16 0 0 1 162 92" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 24h Speed Badge Floating -->
  <g transform="translate(30, 280)" filter="url(#shadow)">
    <rect width="170" height="80" rx="12" fill="#0A192F" stroke="#FF7A00" stroke-width="2"/>
    <text x="15" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#00C853">🚀 Entrega Rápida</text>
    <text x="15" y="55" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff">EN 24 HORAS</text>
  </g>
</svg>
